<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZION App</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 450px; background: #0f172a; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    
    header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
    .content { flex: 1; padding: 20px; overflow-y: auto; }
    
    .nav-bar { background: #1e293b; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #334155; }
    .nav-item { color: #94a3b8; cursor: pointer; text-align: center; font-size: 0.8em; }
    .nav-item.active { color: #38bdf8; }

    .card { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; margin-bottom: 20px; }
    .balance { font-size: 2em; color: #4ade80; font-weight: bold; margin: 10px 0; }
    button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 10px; }
    
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>

<div class="app-container">
  <header><b>ZION</b></header>
  
  <div class="content">
    <!-- Home View -->
    <div id="home" class="view active">
      <h2>📽️ Feed</h2>
      <div class="card">ZION Teaser... <br> ❤️ 120 Likes</div>
      <div class="card">Wallet Guide... <br> ❤️ 85 Likes</div>
    </div>

    <!-- Live View -->
    <div id="live" class="view">
      <h2>🔴 Live Stream</h2>
      <div class="card">
        <p>Soulivan Live 👁️ 1,240</p>
        <button onclick="sendGift()" style="background:#e11d48">🎁 ส่งของขวัญ (50 Coins)</button>
      </div>
    </div>

    <!-- Wallet View -->
    <div id="wallet" class="view">
      <h2>💎 Wallet</h2>
      <div class="card">
        <p>ยอดเงินคงเหลือ:</p>
        <div class="balance"><span id="coinBalance">950</span></div>
        <button onclick="topUp()">+ เติมเงิน</button>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" onclick="showView('home', this)">🏠<br>Home</div>
    <div class="nav-item" onclick="showView('live', this)">🔴<br>Live</div>
    <div class="nav-item" onclick="showView('wallet', this)">💎<br>Wallet</div>
  </div>
</div>

<script>
  let balance = 950;
  function showView(id, el) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
  }
  function topUp() { balance += 100; document.getElementById('coinBalance').innerText = balance; }
  function sendGift() { if(balance >= 50) { balance -= 50; document.getElementById('coinBalance').innerText = balance; alert("ส่งสำเร็จ!"); } else { alert("เงินไม่พอ"); } }
</script>

</body>
</html>
