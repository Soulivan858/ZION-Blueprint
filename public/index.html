<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZION Interactive Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .header { text-align: center; padding: 15px 0; border-bottom: 2px solid #334155; }
    .header h1 { color: #38bdf8; margin: 0; font-size: 1.8em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .card h2 { color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; font-size: 1.3em; }
    .balance { font-size: 2em; color: #4ade80; font-weight: bold; margin: 10px 0; }
    .btn-group { display: flex; gap: 10px; }
    button { background: #2563eb; color: white; border: none; padding: 10px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; transition: 0.2s; }
    button:active { transform: scale(0.98); }
    .btn-gift { background: #e11d48; }
    .log-box { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 8px; font-size: 0.85em; font-family: monospace; color: #94a3b8; height: 80px; overflow-y: auto; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>💎 ZION Ecosystem</h1>
    <p style="color: #94a3b8; margin: 5px 0;">Interactive Demo Prototype</p>
  </div>

  <div class="grid">
    <!-- Wallet Card -->
    <div class="card">
      <h2>💎 ZION Wallet</h2>
      <p style="margin:0; color:#94a3b8;">ยอดเงินคงเหลือ:</p>
      <div class="balance"><span id="coinBalance">950</span> <span style="font-size: 0.4em; color:#94a3b8;">Coins</span></div>
      <div class="btn-group">
        <button onclick="topUp()">+ เติม 100</button>
        <button onclick="transfer()">💸 โอน 50</button>
      </div>
    </div>

    <!-- Live Stream Card -->
    <div class="card">
      <h2>🔴 Live Stream</h2>
      <p style="margin:5px 0;">สตรีมเมอร์: <b>Soulivan Live</b></p>
      <p style="margin:5px 0 15px 0; color:#4ade80;">● Online (👁️ 1,240 Viewers)</p>
      <button class="btn-gift" onclick="sendGift()">🎁 ส่งของขวัญให้สตรีมเมอร์ (50 Coins)</button>
    </div>

    <!-- Activity Log Card -->
    <div class="card">
      <h2>📜 Activity Log</h2>
      <div class="log-box" id="activityLog">
        <div>> System Ready...</div>
      </div>
    </div>
  </div>

  <script>
    let balance = 950;

    function addLog(msg) {
      const logBox = document.getElementById('activityLog');
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updateBalance() {
      document.getElementById('coinBalance').innerText = balance;
    }

    function topUp() {
      balance += 100;
      updateBalance();
      addLog("✅ เติมเงินสำเร็จ +100 Coins");
    }

    function transfer() {
      const pin = prompt("🔐 ยืนยันรหัส PIN (6 หลัก):");
      if (pin) {
        if (balance >= 50) {
          balance -= 50;
          updateBalance();
          addLog("💸 โอนเงินสำเร็จ -50 Coins");
        } else {
          alert("❌ ยอดเงินไม่พอ!");
        }
      }
    }

    function sendGift() {
      if (balance >= 50) {
        balance -= 50;
        updateBalance();
        addLog("🎁 ส่ง Gift ให้สตรีมเมอร์ -50 Coins");
      } else {
        alert("❌ ยอดเงินไม่พอเติม/ส่งของขวัญ!");
      }
    }
  </script>

</body>
</html>
